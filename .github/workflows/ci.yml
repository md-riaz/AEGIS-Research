name: AEGIS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Variable mapping (set these under Settings → Secrets and variables → Actions):
#   vars.LLM_URL   → LLM_BASE_URL  (e.g. https://api.groq.com/openai/v1)
#   vars.LLM_KEY   → LLM_API_KEY   (store as a Secret for security)
#   vars.LLM_MODEL → LLM_MODEL     (e.g. llama-3.1-8b-instant)

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Unit tests — fully offline, no LLM, no database
  # ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Semantic mapper tests
        run: python -m unittest tests/test_mapper.py -v

      - name: SQL compiler smoke-test
        run: PYTHONPATH=. python tests/test_compiler.py

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Benchmark — LLM API only, no database
  #   Runs 10 queries in CI (full 100 locally via --limit 0 or omitting CI_QUERY_LIMIT).
  #   Uploads results as a downloadable artifact.
  # ─────────────────────────────────────────────────────────────────────────────
  benchmark:
    name: Benchmark (10 queries, LLM only)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 10
    env:
      LLM_BASE_URL: ${{ vars.LLM_URL }}
      LLM_API_KEY: ${{ vars.LLM_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      CI_QUERY_LIMIT: "10"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run benchmark
        run: python run_benchmark.py

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results-${{ github.run_number }}
          path: evaluation_dataset/benchmark_results.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Integration tests — full stack via Docker Compose
  #   Spins up MySQL 8.0 (auto-seeded with schema.sql + mock_data.sql),
  #   builds and starts the AEGIS FastAPI server, then fires 12 live queries.
  # ─────────────────────────────────────────────────────────────────────────────
  integration:
    name: Integration Tests (MySQL + server + LLM)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Write .env for Docker Compose
        run: |
          echo "LLM_BASE_URL=${{ vars.LLM_URL }}" > .env
          echo "LLM_API_KEY=${{ vars.LLM_KEY }}" >> .env
          echo "LLM_MODEL=${{ vars.LLM_MODEL }}" >> .env

      - name: Start MySQL + AEGIS server
        run: docker compose up -d --build

      - name: Wait for AEGIS server (up to 2 min)
        run: |
          echo "Polling /api/coverage until server responds..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8765/api/coverage > /dev/null 2>&1; then
              echo "Server ready after $((i * 5))s"
              exit 0
            fi
            echo "  attempt $i/24 — waiting 5s..."
            sleep 5
          done
          echo "Server did not come up within 120s"
          docker compose logs
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Verify seed data freshness
        run: |
          docker compose exec -T db mysql -uroot -proot aegis <<'SQL'
          SELECT 'Order'                  AS tbl, COUNT(*) AS total_rows,
                 SUM(CreatedOnUtc >= DATE_SUB(UTC_TIMESTAMP(), INTERVAL 30 DAY))  AS last_30d,
                 SUM(CreatedOnUtc >= DATE_SUB(UTC_TIMESTAMP(), INTERVAL 60 DAY))  AS last_60d
            FROM `Order`
          UNION ALL
          SELECT 'OrderItem',    COUNT(*), NULL, NULL FROM `OrderItem`
          UNION ALL
          SELECT 'Product',      COUNT(*), NULL, NULL FROM `Product`
          UNION ALL
          SELECT 'Category',     COUNT(*), NULL, NULL FROM `Category`
          UNION ALL
          SELECT 'Manufacturer', COUNT(*), NULL, NULL FROM `Manufacturer`
          UNION ALL
          SELECT 'Customer',     COUNT(*), NULL, NULL FROM `Customer`
          UNION ALL
          SELECT 'Address',      COUNT(*), NULL, NULL FROM `Address`
          UNION ALL
          SELECT 'Country',      COUNT(*), NULL, NULL FROM `Country`
          UNION ALL
          SELECT 'Store',        COUNT(*), NULL, NULL FROM `Store`
          UNION ALL
          SELECT 'Shipment',     COUNT(*), NULL, NULL FROM `Shipment`
          UNION ALL
          SELECT 'Product_Category_Mapping',    COUNT(*), NULL, NULL FROM `Product_Category_Mapping`
          UNION ALL
          SELECT 'Product_Manufacturer_Mapping', COUNT(*), NULL, NULL FROM `Product_Manufacturer_Mapping`;
          SQL

          # Fail if Order has no rows in the last 30 days (date refresh did not work)
          RECENT=$(docker compose exec -T db mysql -uroot -proot aegis -sN -e \
            "SELECT COUNT(*) FROM \`Order\` WHERE CreatedOnUtc >= DATE_SUB(UTC_TIMESTAMP(), INTERVAL 30 DAY);")
          echo "Orders in last 30 days: $RECENT"
          if [ "$RECENT" -lt 1 ]; then
            echo "ERROR: No recent Order rows — 3_refresh_dates.sql may not have run."
            exit 1
          fi

      - name: Run live query tests
        run: python tests/test_query.py

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=100
