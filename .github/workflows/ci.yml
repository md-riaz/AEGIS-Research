name: AEGIS CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Semantic mapper tests
        run: python -m unittest tests/test_mapper.py -v

      - name: Time grammar tests
        run: python -m unittest tests.test_time_grammar -v

      - name: Grounding engine tests
        run: python -m unittest tests.test_grounding -v

      - name: Resolution and abstention tests
        run: python -m unittest tests.test_resolution -v

      - name: Visualization rule tests
        run: python -m unittest tests.test_visualization -v

      - name: Compiler temporal regression tests
        run: python -m unittest tests.test_compiler_time -v

      - name: Rate limiter and concurrency tests
        run: python -m unittest tests.test_rate_limiter -v

      - name: SQL compiler smoke test
        run: PYTHONPATH=. python tests/test_compiler.py

  db-integration:
    name: Database Integration (MySQL + seeded schema, no LLM)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    env:
      MYSQL_DATABASE: safedash
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3307
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - name: Create an empty .env for Compose
        run: touch .env

      - name: Start MySQL only
        run: docker compose up -d db

      - name: Wait for MySQL to accept connections
        run: |
          for i in $(seq 1 36); do
            if docker compose exec -T db mysqladmin ping -uroot -proot --silent 2>/dev/null; then
              echo "MySQL ready after $((i * 5))s"
              exit 0
            fi
            echo "attempt $i/36: waiting 5s"
            sleep 5
          done
          docker compose logs db
          exit 1

      - name: Wait for seed data to finish loading
        run: |
          for i in $(seq 1 36); do
            ROWS=$(docker compose exec -T db mysql -uroot -proot "$MYSQL_DATABASE" -sN \
              -e "SELECT COUNT(*) FROM \`Order\`;" 2>/dev/null || echo 0)
            if [ "${ROWS:-0}" -gt 0 ]; then
              echo "Seed data present: $ROWS orders"
              exit 0
            fi
            echo "attempt $i/36: seed not loaded yet, waiting 5s"
            sleep 5
          done
          docker compose logs db
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install verifier dependencies
        run: pip install -r requirements.txt

      - name: Report seeded database contents
        run: |
          docker compose exec -T db mysql -uroot -proot "$MYSQL_DATABASE" <<'SQL'
          SELECT 'Order' AS tbl, COUNT(*) AS rows_present FROM `Order`
          UNION ALL SELECT 'OrderItem', COUNT(*) FROM `OrderItem`
          UNION ALL SELECT 'Product', COUNT(*) FROM `Product`
          UNION ALL SELECT 'Category', COUNT(*) FROM `Category`
          UNION ALL SELECT 'Customer', COUNT(*) FROM `Customer`;
          SQL

      - name: Resolve, compile and execute the 500-question dataset
        run: python evaluation_dataset/verify_nopcommerce_500_dataset.py

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs db
