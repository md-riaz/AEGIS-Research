

services:
  aegis:
    build: .
    ports:
      - "${AEGIS_PORT:-8765}:8765"
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: aegis
      AEGIS_PORT: 8765
      AEGIS_WIDGET_STORAGE: /app/demo/demo_widgets.json
    volumes:
      - aegis_demo_widgets:/app/demo
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=5).read()"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  db:
    build:
      context: ./database
    ports:
      - "${AEGIS_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aegis
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  smoke:
    build: .
    profiles: ["smoke"]
    env_file:
      - path: .env
        required: false
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: aegis
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "evaluation_dataset/docker_seed_smoke.py"]

volumes:
  aegis_demo_widgets:
