version: '3.8'

services:
  safedash:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - .env
    volumes:
      # Mount demo and evaluation_dataset directories to persist widgets and benchmark data
      - ./demo:/app/demo
      - ./evaluation_dataset:/app/evaluation_dataset
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: safedash
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/mock_data.sql:/docker-entrypoint-initdb.d/2_mock_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
