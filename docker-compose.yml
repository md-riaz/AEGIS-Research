

services:
  aegis:
    build: .
    ports:
      - "8765:8765"
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: safedash
    volumes:
      # Mount demo and evaluation_dataset directories to persist widgets and benchmark data
      - ./demo:/app/demo
      - ./evaluation_dataset:/app/evaluation_dataset
      # Mount source code for live reload during development
      - ./static:/app/static
      - ./aegis:/app/aegis
      - ./run_demo_server.py:/app/run_demo_server.py
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: safedash
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./database/mock_data.sql:/docker-entrypoint-initdb.d/2_mock_data.sql
      - ./database/3_refresh_dates.sql:/docker-entrypoint-initdb.d/3_refresh_dates.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped
